# nginx do MDM atrás do Cloudflare Tunnel (produção atual).
# TLS público termina no Cloudflare; o túnel entrega em http://127.0.0.1:8090.
# Instalar: sudo cp nginx/mdm-tunnel.conf /etc/nginx/sites-available/mdm.conf
#           sudo ln -sf /etc/nginx/sites-available/mdm.conf /etc/nginx/sites-enabled/mdm.conf
#           sudo nginx -t && sudo systemctl reload nginx
# Ingress do túnel (/etc/cloudflared/config.yml), antes do http_status:404:
#   - hostname: mdm.tubaraoemprestimo.com.br
#     service: http://127.0.0.1:8090
# Sem túnel (DNS direto + Let's Encrypt): usar mdm.conf.example.
#
# Publica SOMENTE /mdm, /checkin e /scep. A API do NanoHUB (/api/) NUNCA sai daqui.

server {
    listen 127.0.0.1:8090;
    server_name _;

    server_tokens off;
    # Respostas MDM (inventário, lista de apps) podem passar de 1 MB.
    client_max_body_size 20m;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;

    access_log /var/log/nginx/mdm.access.log combined;
    error_log  /var/log/nginx/mdm.error.log warn;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;

    location = /mdm {
        limit_except PUT { deny all; }
        proxy_pass http://127.0.0.1:9004;
    }

    location = /checkin {
        limit_except PUT { deny all; }
        proxy_pass http://127.0.0.1:9004;
    }

    # SCEP: GET (GetCACert/GetCACaps) e POST (PKIOperation).
    location = /scep {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:2016;
    }

    location / { return 404; }
}
